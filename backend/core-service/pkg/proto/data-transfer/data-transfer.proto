syntax = "proto3";

package datatransfer.v1;

option go_package = "github.com/axmdl1/MedicalDataExchange/core-service/pkg/gen/go/datatransfer;datatransferv1";

service DataTransferService {
  // --- Medical Data CRUD ---
  rpc CreateMedicalData(CreateMedicalDataRequest) returns (CreateMedicalDataResponse);
  rpc GetMedicalData(GetMedicalDataRequest) returns (GetMedicalDataResponse);
  rpc DeleteMedicalData(DeleteMedicalDataRequest) returns (DeleteMedicalDataResponse);
  rpc ListMedicalData(ListMedicalDataRequest) returns (ListMedicalDataResponse);

  // --- Data Transfer logic ---
  rpc CreateDataTransfer(CreateDataTransferRequest) returns (CreateDataTransferResponse);
  rpc GetDataTransfer(GetDataTransferRequest) returns (GetDataTransferResponse);
  rpc ListDataTransfers(ListDataTransfersRequest) returns (ListDataTransfersResponse);

  // Пациент подтверждает или отклоняет запрос
  rpc HandleDataTransferDecision(HandleDataTransferDecisionRequest) returns (HandleDataTransferDecisionResponse);

  // --- Clinic CRUD ---
  rpc CreateClinic(CreateClinicRequest) returns (CreateClinicResponse);
  rpc GetClinic(GetClinicRequest) returns (GetClinicResponse);
  rpc UpdateClinic(UpdateClinicRequest) returns (UpdateClinicResponse);
  rpc DeleteClinic(DeleteClinicRequest) returns (DeleteClinicResponse);
  rpc ListClinics(ListClinicsRequest) returns (ListClinicsResponse);

  // --- Patient Access ---
  rpc CreatePatientAccessRequest(CreatePatientAccessRequestRequest) returns (CreatePatientAccessRequestResponse);
  rpc ApprovePatientAccessRequest(ApprovePatientAccessRequestRequest) returns (ApprovePatientAccessRequestResponse);
  rpc RejectPatientAccessRequest(RejectPatientAccessRequestRequest) returns (RejectPatientAccessRequestResponse);
  rpc GetPatientAccessRequest(GetPatientAccessRequestRequest) returns (GetPatientAccessRequestResponse);
  rpc ListPatientAccessRequests(ListPatientAccessRequestsRequest) returns (ListPatientAccessRequestsResponse);
  rpc GetTemporaryPatientData(GetTemporaryPatientDataRequest) returns (GetTemporaryPatientDataResponse);
  rpc RevokePatientAccess(RevokePatientAccessRequest) returns (RevokePatientAccessResponse);
}

// --- Entities ---

message MedicalData {
  int64 id = 1;
  int64 user_id = 2;
  int64 clinic_id = 3;
  string diagnosis = 4;
  string complaint = 5;
  string treatment = 6;
  string medications = 7;
  string allergies = 8;
  string doctor_notes = 9;
  string lab_results = 10;
  string created_at = 11;
  string updated_at = 12;
}

message DataTransfer {
  int64 id = 1;
  int64 medical_data_id = 2;
  int64 from_clinic_id = 3;
  int64 to_clinic_id = 4;
  int64 user_id = 5;
  string status = 6; // pending, confirmed, rejected
  string created_at = 7;
  string updated_at = 8;
}

// --- MedicalData messages ---

message CreateMedicalDataRequest {
  MedicalData medical_data = 1;
}

message CreateMedicalDataResponse {
  MedicalData medical_data = 1;
}

message GetMedicalDataRequest {
  int64 id = 1;
}

message GetMedicalDataResponse {
  MedicalData medical_data = 1;
}

message DeleteMedicalDataRequest {
  int64 id = 1;
}

message DeleteMedicalDataResponse {
  bool success = 1;
}

message ListMedicalDataRequest {
  optional int64 user_id = 1;
  optional int64 clinic_id = 2;
}

message ListMedicalDataResponse {
  repeated MedicalData medical_data = 1;
}

// --- DataTransfer messages ---

message CreateDataTransferRequest {
  int64 medical_data_id = 1;
  int64 from_clinic_id = 2;
  int64 to_clinic_id = 3;
  int64 user_id = 4;
}

message CreateDataTransferResponse {
  DataTransfer transfer = 1;
}

message GetDataTransferRequest {
  int64 id = 1;
}

message GetDataTransferResponse {
  DataTransfer transfer = 1;
}

message ListDataTransfersRequest {
  optional int64 clinic_id = 1;
  optional int64 user_id = 2;
  optional string status = 3; // optional filter
}

message ListDataTransfersResponse {
  repeated DataTransfer transfers = 1;
}

message HandleDataTransferDecisionRequest {
  int64 transfer_id = 1;
  int64 user_id = 2;
  bool confirm = 3; // true = confirm, false = reject
}

message HandleDataTransferDecisionResponse {
  DataTransfer transfer = 1;
}

// --- Clinic Entity ---

message Clinic {
  int64 id = 1;
  string name = 2;
  string address = 3;
  string phone = 4;
  string email = 5;
  string created_at = 6;
  string updated_at = 7;
}

// --- Clinic messages ---

message CreateClinicRequest {
  Clinic clinic = 1;
}

message CreateClinicResponse {
  Clinic clinic = 1;
}

message GetClinicRequest {
  int64 id = 1;
}

message GetClinicResponse {
  Clinic clinic = 1;
}

message UpdateClinicRequest {
  Clinic clinic = 1;
}

message UpdateClinicResponse {
  Clinic clinic = 1;
}

message DeleteClinicRequest {
  int64 id = 1;
}

message DeleteClinicResponse {
  bool success = 1;
}

message ListClinicsRequest {
}

message ListClinicsResponse {
  repeated Clinic clinics = 1;
}

// --- Patient Access messages ---

message PatientAccessRequest {
  int64 id = 1;
  int64 patient_id = 2;
  int64 clinic_id = 3;
  int64 medical_data_id = 4;
  string status = 5; // pending, approved, rejected, expired
  string blockchain_tx_id = 6;
  string requested_at = 7;
  string approved_at = 8;
  string expires_at = 9;
}

message TemporaryPatientData {
  int64 id = 1;
  string access_token = 2;
  int64 patient_id = 3;
  int64 clinic_id = 4;
  int64 medical_data_id = 5;
  string granted_at = 6;
  string expires_at = 7;
  bool is_revoked = 8;
}

message CreatePatientAccessRequestRequest {
  int64 patient_id = 1;
  int64 clinic_id = 2;
  int64 medical_data_id = 3;
}

message CreatePatientAccessRequestResponse {
  PatientAccessRequest request = 1;
}

message ApprovePatientAccessRequestRequest {
  int64 request_id = 1;
  int64 approver_id = 2;
}

message ApprovePatientAccessRequestResponse {
  PatientAccessRequest request = 1;
  TemporaryPatientData temporary_data = 2;
}

message RejectPatientAccessRequestRequest {
  int64 request_id = 1;
}

message RejectPatientAccessRequestResponse {
  PatientAccessRequest request = 1;
}

message GetPatientAccessRequestRequest {
  int64 request_id = 1;
}

message GetPatientAccessRequestResponse {
  PatientAccessRequest request = 1;
}

message ListPatientAccessRequestsRequest {
  optional int64 patient_id = 1;
  optional int64 clinic_id = 2;
  optional string status = 3;
}

message ListPatientAccessRequestsResponse {
  repeated PatientAccessRequest requests = 1;
}

message GetTemporaryPatientDataRequest {
  string access_token = 1;
}

message GetTemporaryPatientDataResponse {
  MedicalData medical_data = 1;
}

message RevokePatientAccessRequest {
  string access_token = 1;
}

message RevokePatientAccessResponse {
  bool success = 1;
}
