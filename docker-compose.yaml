version: "3.9"

name: medical-data-exchange

services:
  postgres:
    image: postgres:16-alpine
    container_name: mde-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medical
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mednet]

  # gRPC user-service
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: mde-user
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Внутри контейнера сервис читает config/docker.yaml (см. Dockerfile),
      # но оставим dsn и секрет ещё и как ENV на будущее.
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=medical port=5432 sslmode=disable"
      JWT_SECRET: "supersecret"
      JWT_TTL_MIN: "120"
    ports:
      - "50053:50053"
    networks: [mednet]

  # gRPC data-transfer-service (если уже нужен)
  data-transfer-service:
    build:
      # ВАЖНО: build context на корень репо — потому что в go.mod есть replace => ../core-service
      context: .
      dockerfile: data-transfer-service/Dockerfile
    container_name: mde-dt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=medical port=5432 sslmode=disable"
    ports:
      - "50052:50052"
    networks: [mednet]

  # REST API gateway (core-service)
  core-service:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    container_name: mde-core
    depends_on:
      - user-service
      - data-transfer-service
    environment:
      # core читает config/docker.yaml, но пусть будут ENV на будущее
      REST_PORT: "8099"
      GRPC_USER_ADDR: "user-service:50053"
      GRPC_DT_ADDR: "data-transfer-service:50052"
    ports:
      - "8099:8099"
    networks: [mednet]

volumes:
  pgdata:

networks:
  mednet:
    driver: bridge