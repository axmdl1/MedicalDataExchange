<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medical Data Exchange — Sign In</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <h1>Medical Data Exchange</h1>

        <!-- LOGIN -->
        <div class="form-section" id="login-section">
            <h2>Sign In</h2>
            <form id="login-form">
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email" required />
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Password" required />
                </div>
                <button class="btn btn-primary" type="submit">Sign In</button>
            </form>
            <p class="switch-text">
                Don’t have an account? <a href="#" id="show-register">Sign up</a>
            </p>
        </div>

        <!-- REGISTER -->
        <div class="form-section hidden" id="register-section">
            <h2>Sign Up</h2>
            <form id="register-form">
                <div class="form-group">
                    <input type="text" name="firstName" placeholder="First Name" required />
                </div>
                <div class="form-group">
                    <input type="text" name="lastName" placeholder="Last Name" required />
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email" required />
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Password" required />
                </div>
                <button class="btn btn-secondary" type="submit">Create Account</button>
            </form>
            <p class="switch-text">
                Already have an account? <a href="#" id="show-login">Sign in</a>
            </p>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
